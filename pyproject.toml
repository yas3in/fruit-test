[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fruitcraft-bot"
version = "0.1.0"
description = "Modular Python async client and automation library for FruitCraft"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "FruitCraft Bot Team" }
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "aiosqlite>=0.20.0",
    "click>=8.1.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
fruitcraft = "fruitcraft_bot.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/fruitcraft_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
